[package]
name = "docu_ffacd"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = "1.18.1"
chrono = "0.4"
fancy-regex = "0.18"
indexmap = "2.14"
log = "0.4"
simplelog = "0.12"
rayon = "1.12"
roxmltree = "0.21"
rust_xlsxwriter = "0.95"
unidecode = "0.3"
walkdir = "2.5"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
rfd = "0.15"
tempfile = "3"
anyhow = "1.0"
arboard = "3"
mupdf = { version = "0.8", default-features = false, features = ["base14-fonts"] }

[build-dependencies]
slint-build = "1.18.1"

