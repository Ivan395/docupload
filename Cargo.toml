[package]
name = "docu_ffacd"
version = "0.5.0"
edition = "2024"
authors = ["Firma Fiscal ACD <soporte@firmafiscalacd.com>"]
description = "DocuUpload - Procesamiento concurrente y validación de nóminas CFDI (SAT SOAP) y cédulas SUA IMSS"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Ivan395/docupload"
keywords = ["sat", "cfdi", "sua", "imss", "nominas"]
categories = ["office-software", "gui"]

[dependencies]
slint = "1.18.1"
chrono = "0.4"
fancy-regex = "0.18"
indexmap = "2.14"
log = "0.4"
simplelog = "0.12"
rayon = "1.12"
roxmltree = "0.21"
rust_xlsxwriter = "0.95"
unidecode = "0.3"
walkdir = "2.5"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
rfd = "0.15"
tempfile = "3"
anyhow = "1.0"
arboard = "3"
mupdf = { version = "0.8", default-features = false, features = ["base14-fonts"] }
postgres = { version = "0.19", features = ["with-chrono-0_4", "with-uuid-1"] }
uuid = { version = "1.10", features = ["v4", "v7"] }
r2d2 = "0.8.10"
r2d2_postgres = "0.18.2"
sha2 = "0.10"
rust-s3 = { version = "0.37.2", default-features = false, features = ["sync-rustls-tls"] }

[build-dependencies]
slint-build = "1.18.1"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

# --- Metadata para cargo-bundle (macOS .app/.dmg, Windows, Linux) ---
[package.metadata.bundle]
name = "DocuUpload"
identifier = "com.docuffacd.docupload"
icon = ["ui/assets/app_icon.png", "ui/assets/app_icon_256.png", "ui/assets/app_icon.ico", "ui/assets/app_icon.icns"]
version = "0.5.0"
copyright = "Copyright © 2026 Firma Fiscal ACD. Todos los derechos reservados."
category = "Business"
short_description = "DocuUpload Fiscal & Nóminas"
long_description = """
DocuUpload Fiscal & Nóminas ACD
Procesamiento concurrente y en paralelo de Nóminas CFDI con validación directa ante el WebService SOAP del SAT y Cédulas de Determinación de Cuotas del SUA IMSS con extracción de amortizaciones Infonavit y reportes en Excel.
"""
osx_minimum_system_version = "10.15"

# --- Metadata para cargo-deb (Debian, Ubuntu) ---
[package.metadata.deb]
name = "docu-ffacd"
maintainer = "Firma Fiscal ACD <soporte@firmafiscalacd.com>"
copyright = "2026, Firma Fiscal ACD"
license-file = ["LICENSE", "4"]
depends = "$auto, libfontconfig1, libfreetype6"
section = "utils"
priority = "optional"
assets = [
    ["target/release/docu_ffacd", "usr/bin/docu_ffacd", "755"],
    ["packaging/linux/docu_ffacd.desktop", "usr/share/applications/docu_ffacd.desktop", "644"],
    ["ui/assets/app_icon_256.png", "usr/share/icons/hicolor/256x256/apps/docu_ffacd.png", "644"],
    ["ui/assets/app_icon_64.png", "usr/share/icons/hicolor/64x64/apps/docu_ffacd.png", "644"],
    ["ui/assets/app_icon_32.png", "usr/share/icons/hicolor/32x32/apps/docu_ffacd.png", "644"],
    ["ui/assets/app_icon.svg", "usr/share/icons/hicolor/scalable/apps/docu_ffacd.svg", "644"],
]

# --- Metadata para cargo-generate-rpm (Fedora, RHEL) ---
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/docu_ffacd", dest = "/usr/bin/docu_ffacd", mode = "755" },
    { source = "packaging/linux/docu_ffacd.desktop", dest = "/usr/share/applications/docu_ffacd.desktop", mode = "644" },
    { source = "ui/assets/app_icon_256.png", dest = "/usr/share/icons/hicolor/256x256/apps/docu_ffacd.png", mode = "644" },
    { source = "ui/assets/app_icon_64.png", dest = "/usr/share/icons/hicolor/64x64/apps/docu_ffacd.png", mode = "644" },
    { source = "ui/assets/app_icon_32.png", dest = "/usr/share/icons/hicolor/32x32/apps/docu_ffacd.png", mode = "644" },
    { source = "ui/assets/app_icon.svg", dest = "/usr/share/icons/hicolor/scalable/apps/docu_ffacd.svg", mode = "644" },
]


