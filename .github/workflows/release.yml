name: Release Multiplatform Packages

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Packages (Deb, RPM, Arch, AppImage)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm zstd libfontconfig1-dev libfreetype6-dev libx11-dev libxext-dev libxrender-dev libfuse2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build Debian/Ubuntu Package (.deb)
        run: ./packaging/debian/build_deb.sh

      - name: Build Fedora/RHEL Package (.rpm)
        run: ./packaging/fedora/build_rpm.sh

      - name: Build Arch Linux Package (.pkg.tar.zst)
        run: ./packaging/arch/build_arch.sh

      - name: Build Linux AppImage (.AppImage)
        run: |
          mkdir -p target
          curl -fsSL https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o target/appimagetool
          chmod +x target/appimagetool
          ./packaging/appimage/build_appimage.sh

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: target/packages/*

  build-windows:
    name: Build Windows Packages (.exe installer & .zip)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package Windows ZIP & Installer
        shell: cmd
        run: packaging\windows\build_windows.bat

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: target/packages/*

  build-macos:
    name: Build macOS Packages (.app & .dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package macOS App & DMG
        run: ./packaging/macos/build_dmg.sh

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: target/packages/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(grep '^version = ' Cargo.toml | head -n1 | cut -d '"' -f2)
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using release tag: $TAG"

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: all-packages
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "DocUpload ${{ steps.release_tag.outputs.tag }}"
          files: all-packages/*
          generate_release_notes: true
          draft: false
          prerelease: false
